<!DOCTYPE html>
<html lang="az"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sosial siyasət – Adam asmaca</title>
<style>
:root{--bg:#f3f5fb;--cd:#fff;--tx:#1d2340;--mu:#6b7194;--ac:#5b5bd6;--ok:#1f9d63;--bd:#e5484d;--ky:#e6e9f7;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12152a;--cd:#1c2040;--tx:#eef0ff;--mu:#9aa0c8;--ky:#2a2f58}}
:root[data-theme="dark"]{--bg:#12152a;--cd:#1c2040;--tx:#eef0ff;--mu:#9aa0c8;--ky:#2a2f58}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.w{max-width:720px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:4px 0 14px}h1 small{color:var(--mu);font-weight:500;font-size:15px}
.cd{background:var(--cd);border-radius:18px;padding:14px;box-shadow:0 4px 18px rgba(30,40,100,.1)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
.pk{background:var(--cd);border:2px solid transparent;border-radius:18px;padding:8px;cursor:pointer;text-align:center;color:var(--tx);font:inherit;font-weight:600;box-shadow:0 4px 14px rgba(30,40,100,.1);transition:.15s}
.pk:hover,.pk:focus-visible{border-color:var(--ac);transform:translateY(-3px)}
.pk svg{width:100%;height:170px}
.bar{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px;font-weight:600;flex-wrap:wrap}
button{font:inherit;cursor:pointer}
.btn{background:var(--ac);color:#fff;border:0;border-radius:12px;padding:10px 18px;font-weight:600}
.btn.g{background:var(--ky);color:var(--tx)}
#stage svg{width:100%;max-height:330px;display:block}
#wd{display:flex;flex-wrap:wrap;justify-content:center;gap:6px 5px;margin:12px 0 6px}
.l{width:clamp(22px,6vw,34px);height:clamp(30px,8vw,42px);border-bottom:3px solid var(--ac);text-align:center;font-size:clamp(18px,5vw,26px);font-weight:700;line-height:1.5}
.l.s{border:0;width:12px}.l.m{color:var(--bd)}
#hn{text-align:center;color:var(--mu);font-size:14px;margin:4px 0 10px}
#kb{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:6px}
#kb button{background:var(--ky);color:var(--tx);border:0;border-radius:10px;padding:10px 0;font-weight:700}
#kb button.ok{background:var(--ok);color:#fff}#kb button.no{background:var(--bd);color:#fff}
#kb button:disabled{cursor:default}
#ms{text-align:center;font-weight:700;margin:12px 0 4px;min-height:24px}
#nx{display:block;margin:8px auto 0}
@keyframes sway{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2deg)}}
@keyframes pop{from{transform:scale(.2);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
.sw{transform-box:view-box;transform-origin:200px 40px;animation:sway 3s ease-in-out infinite}
.sw.dead{animation-duration:.8s}
.hop{animation:hop .6s ease-in-out infinite}
.nw{transform-box:fill-box;transform-origin:center;animation:pop .45s cubic-bezier(.2,1.4,.4,1)}
</style></head><body><div class="w">
<h1>Sosial siyasət <small>· Adam asmaca</small></h1>
<section id="pk"><p style="margin:0 0 10px;color:var(--mu)">Obrazını seç:</p><div class="grid" id="gr"></div></section>
<section id="gm" hidden>
<div class="bar"><span id="nm"></span><span id="sc"></span><span id="lv"></span><button class="btn g" id="ch">Obrazı dəyiş</button></div>
<div class="cd"><div id="stage"></div><div id="wd" aria-live="polite"></div><div id="hn"></div><div id="kb"></div><div id="ms"></div><button class="btn" id="nx" hidden>Növbəti söz →</button></div>
</section></div>
<script>
const $=i=>document.getElementById(i),MAX=6,AL='ABCÇDEƏFGĞHXIİJKQLMNOÖPRSŞTUÜVYZ';
const T=[['SOSİAL','İnsanların bir-biri ilə qarşılıqlı münasibətlərini ifadə edən anlayış'],['İCTİMAİ','Bütün cəmiyyətə aid, hamının faydalandığı ümumi məsələləri əhatə edən anlayış'],['SOSİETAL','Cəmiyyətin bütövlükdə quruluşuna və işləyişinə aid ən geniş anlayış'],['SOSİAL SİYASƏT','Dövlətin əhalinin həyat şəraitini bərabərləşdirməyə yönəlmiş daxili siyasəti'],['SOSİAL STRUKTUR','Cəmiyyətdə insanların qruplaşması və qruplar arası əlaqələr'],['ORTA SİNİF','Cəmiyyətin ən əsas təbəqəsi'],['SOSİAL İŞ','Siyasətin icrasında fərdlərlə birbaşa işləyən peşə fəaliyyəti'],['SOSİAL SFERA','Sosial siyasətin birbaşa obyekti: səhiyyə, təhsil, sığorta və s.'],['SƏHİYYƏ','Sosial sferanın tərkibində sağlamlığı qoruyan sahə'],['SOSİAL SIĞORTA','Səhiyyə və təhsillə yanaşı sosial sferanın tərkib hissəsi'],['İŞSİZLİK','Peşə təlimi proqramları və sığorta ilə mübarizə aparılan problem'],['PENSİYA','Yaşlılara dövlətin verdiyi sosial təminat forması'],['ƏMƏK HÜQUQLARI','İş saatları, təhlükəsizlik qaydaları və minimum əməkhaqqı bununla qorunur'],['MİNİMUM ƏMƏKHAQQI','Qanunla müəyyən olunan ən aşağı əmək haqqı'],['İQTİSADİ BƏRABƏRSİZLİK','Varlılardan vergi alınaraq aztəminatlılara yardımla azaldılan hal'],['XEYRİYYƏÇİLİK','Dini təşkilatların sosial sahədə apardığı fəaliyyət'],['MƏNƏVİ SFERA','Maarif, təhsil və mədəniyyət sistemləri ilə bağlı cəmiyyət sahəsi'],['KONFESSİONAL SİYASƏT','Dövlətin dinlə münasibətlərini tənzimləyən siyasət'],['İSTEHSAL MƏRHƏLƏSİ','Yeliseyevin birinci mərhələsi: doğum, sağlamlıq, tərbiyə, təhsil'],['BÖLÜŞDÜRMƏ','Yeliseyevin ikinci mərhələsi: insan potensialından istifadənin nizamlanması'],['İSTEHLAK','Yeliseyevin üçüncü mərhələsi: maddi rifah və xidmətlərin yaranması'],['İNSAN KAPİTALI','Biliklərin, bacarıqların və təcrübənin cəmi'],['SOSİAL İNFRASTRUKTUR','Əhalinin normal həyat fəaliyyətini təmin edən sahə və müəssisələr məcmusu'],['XƏTTİ İNFRASTRUKTUR','Dəmir yolları, avtomobil yolları, rabitə və elektrik xətləri'],['NÖQTƏVARİ İNFRASTRUKTUR','Məktəb, poliklinika, idman obyekti kimi ayrı-ayrı obyektlər'],['SAHƏ YANAŞMASI','Sosial infrastrukturun izahına iki konseptual yanaşmadan biri'],['FƏALİYYƏT YANAŞMASI','J.T.Toşenkoya görə insan birliyinin həyat fəaliyyətini tam əhatə edən yanaşma'],['SOSİAL MÜDAFİƏ','Dövlətin işçilərə və ehtiyacı olanlara təmin etdiyi qorunma'],['SOSİAL YARDIM','Az gəlirli ailələrə dövlətin ayırdığı dəstək']];
const C=[{n:'Leyla',t:'girl',skin:'#f2c29b',shirt:'#ff6fa5',pants:'#6a5acd',hair:'#5a3220'},{n:'Rəşad',t:'boy',skin:'#e8b78c',shirt:'#3b9cff',pants:'#2f3b6b',hair:'#2a1a12'},{n:'Robo',t:'robot',skin:'#b9c6d6',shirt:'#ffb020',pants:'#5a6a85',hair:'#ff4d4d'},{n:'Pişik',t:'cat',skin:'#ff9a3c',shirt:'#34c28a',pants:'#2b6e5a',hair:'#fff'}];
const mix=(h,a)=>{const n=parseInt(h.slice(1),16);return'#'+[16,8,0].map(s=>{let v=(n>>s)&255;v=Math.round(a>0?v+(255-v)*a:v*(1+a));return v.toString(16).padStart(2,'0')}).join('')};
function charG(c,u,n,mood,anim){
const sk=c.skin,sh=c.shirt,pa=c.pants,ha=c.hair,E=mood==='dead';
const defs=[['sk',sk],['sh',sh],['ha',ha],['pa',pa]].map(([k,o])=>`<radialGradient id="${u}${k}" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="${mix(o,.55)}"/><stop offset=".55" stop-color="${o}"/><stop offset="1" stop-color="${mix(o,-.38)}"/></radialGradient>`).join('');
const f=k=>`url(#${u}${k})`;
const limb=(x1,y1,x2,y2,w,o)=>`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${mix(o,-.25)}" stroke-width="${w}" stroke-linecap="round"/><line x1="${x1-w*.15}" y1="${y1}" x2="${x2-w*.15}" y2="${y2}" stroke="${mix(o,.28)}" stroke-width="${w*.45}" stroke-linecap="round"/>`;
const hand=(x,y)=>`<circle cx="${x}" cy="${y}" r="8" fill="${f('sk')}"/>`;
const shoe=x=>`<ellipse cx="${x}" cy="275" rx="12" ry="6.5" fill="#2b2b3d"/><ellipse cx="${x-3}" cy="273" rx="5" ry="2" fill="#fff" opacity=".25"/>`;
let bk='',fr='';
if(c.t==='girl'){bk=`<circle cx="168" cy="110" r="12" fill="${f('ha')}"/><circle cx="232" cy="110" r="12" fill="${f('ha')}"/>`;fr=`<path d="M170 96a30 30 0 0 1 60 0q-14-16-30-14q-16-2-30 14z" fill="${f('ha')}"/>`}
if(c.t==='boy')fr=`<path d="M170 94a30 30 0 0 1 60 0q-8-12-22-10l-8-8l-4 8q-14-4-26 10z" fill="${f('ha')}"/>`;
if(c.t==='robot')bk=`<circle cx="168" cy="98" r="7" fill="${mix(sk,-.3)}"/><circle cx="232" cy="98" r="7" fill="${mix(sk,-.3)}"/><line x1="200" y1="68" x2="200" y2="55" stroke="#556" stroke-width="3"/><circle cx="200" cy="52" r="6" fill="#ff4d4d"/>`;
if(c.t==='cat'){bk=`<path d="M172 86L176 54L198 72z" fill="${f('sk')}"/><path d="M228 86L224 54L202 72z" fill="${f('sk')}"/><path d="M178 78L179 64L190 73z" fill="#ff9ec0"/><path d="M222 78L221 64L210 73z" fill="#ff9ec0"/>`;fr=`<path d="M196 102h8l-4 5z" fill="#ff7aa8"/><g stroke="#fff" stroke-width="1.4" opacity=".8"><line x1="176" y1="106" x2="190" y2="108"/><line x1="176" y1="112" x2="190" y2="111"/><line x1="224" y1="106" x2="210" y2="108"/><line x1="224" y1="112" x2="210" y2="111"/></g>`}
const eyes=E?[190,210].map(x=>`<path d="M${x-5} 90l10 10m0-10l-10 10" stroke="#222" stroke-width="2.5" stroke-linecap="round"/>`).join(''):c.t==='robot'?`<rect x="181" y="88" width="38" height="14" rx="7" fill="#0b2a3d"/><circle cx="191" cy="95" r="4.5" fill="#5ef2ff"/><circle cx="209" cy="95" r="4.5" fill="#5ef2ff"/>`:[190,210].map(x=>`<ellipse cx="${x}" cy="95" rx="6" ry="${mood==='win'?5:7}" fill="#fff"/><circle cx="${x+1}" cy="96" r="3.4" fill="#1b1b2f"/><circle cx="${x+2}" cy="94.6" r="1.1" fill="#fff"/>`).join('');
const mo={ok:'<path d="M191 111q9 7 18 0" fill="none"/>',worry:'<path d="M192 115q8-6 16 0" fill="none"/>',dead:'<path d="M190 115q4-4 10 0t10 0" fill="none"/>',win:'<path d="M189 108q11 17 22 0z" fill="#7a1f2b"/>'}[mood];
const head=`${bk}<circle cx="200" cy="98" r="30" fill="${f('sk')}"/><ellipse cx="188" cy="82" rx="9" ry="5" fill="#fff" opacity=".25"/>${fr}${c.t==='robot'?'':'<circle cx="181" cy="106" r="5" fill="#ff7a9a" opacity=".35"/><circle cx="219" cy="106" r="5" fill="#ff7a9a" opacity=".35"/>'}${eyes}<g stroke="#3a1d1d" stroke-width="2.5" stroke-linecap="round">${mo}</g>`;
const P={1:head,2:`<rect x="176" y="126" width="48" height="84" rx="22" fill="${f('sh')}"/><circle cx="200" cy="160" r="4.5" fill="#fff" opacity=".6"/><circle cx="200" cy="176" r="4.5" fill="#fff" opacity=".6"/>`,3:limb(182,146,156,192,13,sh)+hand(156,195),4:limb(218,146,244,192,13,sh)+hand(244,195),5:limb(190,205,184,268,16,pa)+shoe(182),6:limb(210,205,216,268,16,pa)+shoe(218)};
return`<defs>${defs}<filter id="${u}d" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="2" dy="4" stdDeviation="3" flood-opacity=".28"/></filter></defs><g filter="url(#${u}d)">`+[5,6,2,3,4,1].filter(i=>i<=n).map(i=>`<g${anim&&i===n?' class="nw"':''}>${P[i]}</g>`).join('')+'</g>'}
let ci=0,word,hint,gs,wrong,state,score=0,pool=[],lastW=false;
const shuf=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
$('gr').innerHTML=C.map((c,i)=>`<button class="pk" data-i="${i}"><svg viewBox="135 40 130 250">${charG(c,'p'+i,6,'win',false)}</svg>${c.n}</button>`).join('');
$('kb').innerHTML=[...AL].map(l=>`<button data-l="${l}">${l}</button>`).join('');
$('gr').onclick=e=>{const b=e.target.closest('.pk');if(!b)return;ci=+b.dataset.i;score=0;pool=shuf(T);$('pk').hidden=true;$('gm').hidden=false;$('nm').textContent='Obraz: '+C[ci].n;next()};
$('ch').onclick=()=>{$('gm').hidden=true;$('pk').hidden=false};
$('nx').onclick=next;
function next(){const t=pool.length?pool.pop():(pool=shuf(T)).pop();[word,hint]=t;gs=new Set();wrong=0;state='play';lastW=false;draw()}
function guess(l){if(state!=='play'||gs.has(l))return;gs.add(l);lastW=!word.includes(l);if(lastW)wrong++;
const done=[...word].every(ch=>!AL.includes(ch)||gs.has(ch));
if(wrong>=MAX)state='lose';else if(done){state='win';score+=10-wrong}draw()}
$('kb').onclick=e=>{const b=e.target.closest('button');if(b)guess(b.dataset.l)};
document.onkeydown=e=>{if(e.ctrlKey||e.metaKey||e.altKey||e.key.length!==1||$('gm').hidden)return;const l=e.key.toLocaleUpperCase('az');if(AL.includes(l))guess(l)};
function draw(){
const win=state==='win',dead=state==='lose',mood=win?'win':dead?'dead':wrong>=4?'worry':'ok',n=win?6:wrong;
$('stage').innerHTML=`<svg viewBox="0 0 300 330" role="img" aria-label="Adam asmaca səhnəsi"><defs><linearGradient id="wd2" x1="0" x2="1"><stop offset="0" stop-color="#c58a50"/><stop offset="1" stop-color="#8a5a2e"/></linearGradient></defs><ellipse cx="150" cy="319" rx="135" ry="8" fill="#000" opacity=".12"/><g fill="url(#wd2)"><rect x="30" y="306" width="150" height="11" rx="4"/><rect x="60" y="30" width="12" height="280" rx="4"/><rect x="60" y="30" width="150" height="12" rx="4"/></g><path d="M72 84L112 42" stroke="#8a5a2e" stroke-width="7" stroke-linecap="round"/><g class="${win?'hop':dead?'sw dead':'sw'}">${win?'':'<line x1="200" y1="40" x2="200" y2="68" stroke="#d9b77c" stroke-width="3.5"/>'}${charG(C[ci],'g',n,mood,lastW&&!dead)}</g></svg>`;
$('wd').innerHTML=[...word].map(ch=>!AL.includes(ch)?'<span class="l s"></span>':gs.has(ch)?`<span class="l">${ch}</span>`:dead?`<span class="l m">${ch}</span>`:'<span class="l"></span>').join('');
$('hn').textContent='İpucu: '+hint;
$('sc').textContent='Xal: '+score;$('lv').textContent='♥'.repeat(MAX-wrong)+'♡'.repeat(wrong);$('lv').style.color='var(--bd)';
document.querySelectorAll('#kb button').forEach(b=>{const l=b.dataset.l,g=gs.has(l);b.disabled=g||state!=='play';b.className=g?(word.includes(l)?'ok':'no'):''});
$('ms').textContent=win?'Əla! Obrazı xilas etdin 🎉':dead?'Obraz yıxıldı... Düzgün cavab: '+word:'';
$('nx').hidden=state==='play'}
</script></body></html>
